version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: empresa_db
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: fastapi_api
    ports:
      - "8081:8000"
    environment:
      - API_HOST=localhost:8081
      - DB_USER=user_admin
      - DB_PASSWORD=password123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=empresa_db
      - DB_TYPE=postgresql
    depends_on:
      - db